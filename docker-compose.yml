version: '3.8'
services:
  iptv-proxy:
    build: .
    container_name: iptv-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-8830}:8830"
    env_file:
      - .env
    volumes:
      - ./config.json:/app/config.json:ro
    networks:
      - iptv_net

networks:
  iptv_net:
    driver: bridge
